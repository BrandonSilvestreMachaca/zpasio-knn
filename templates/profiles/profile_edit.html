{% extends "base.html" %}

{% block title %}Editar perfil — Zpasio{% endblock %}

{% block content %}
<h1 class="page-title">Editar datos personales</h1>

<form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn">Guardar</button>
    <p class="btn-link"><a href="{% url 'profiles:detail' %}">Cancelar</a></p>
</form>
{% endblock %}
